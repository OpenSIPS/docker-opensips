---
name: Publish OpenSIPS Image
description: Builds and publishes OpenSIPS docker image to Docker Hub and optionally to GitHub Container Registry
inputs:
  version:
    description: OpenSIPS Version to build the image for
    required: false
  tag:
    description: The Docker tag to publish the image
    required: false
  package:
    description: The Docker image name to publish as (the repo part of opensips/<package>:tag); defaults to opensips
    required: false
  component:
    description: The apt component to pull the OpenSIPS deb from
    required: false
  cli:
    description: Indicates whether to install OpenSIPS CLI as well
    required: false
  modules:
    description: Space-separated additional packages to install
    required: false
  build:
    description: Indicates the build to use
    required: false
  docker-username:
    description: The Docker username to push the image as
    required: true
  docker-token:
    description: The Docker authentication token used
    required: true
  ghcr-token:
    description: GitHub token used to push to ghcr.io (omit to skip GHCR publishing)
    required: false
  ghcr-repo:
    description: Optional repository name to insert into the GHCR path (ghcr.io/opensips/<ghcr-repo>/opensips); defaults to ghcr.io/opensips/opensips
    required: false

runs:
  using: "composite"

  steps:
  - uses: actions/checkout@v6
    with:
      repository: OpenSIPS/docker-opensips

  - name: Prepare Environment
    shell: bash
    run: |
      test -n "${{ inputs.version }}" && echo "OPENSIPS_VERSION=${{ inputs.version }}" >> $GITHUB_ENV || true
      test -n "${{ inputs.tag }}" && echo "OPENSIPS_DOCKER_TAG=${{ inputs.tag }}" >> $GITHUB_ENV || true
      test -n "${{ inputs.package }}" && echo "PACKAGE_NAME=${{ inputs.package }}" >> $GITHUB_ENV || true
      test -n "${{ inputs.cli }}" && echo "OPENSIPS_CLI=${{ inputs.cli }}" >> $GITHUB_ENV || true
      test -n "${{ inputs.modules }}" && echo "OPENSIPS_EXTRA_MODULES=${{ inputs.modules }}" >> $GITHUB_ENV || true
      test -n "${{ inputs.build }}" && echo "OPENSIPS_BUILD=\"${{ inputs.build }}\"" >> $GITHUB_ENV || true
      test -n "${{ inputs.component }}" && echo "OPENSIPS_COMPONENT=\"${{ inputs.component }}\"" >> $GITHUB_ENV || true

  - name: Build the Docker image
    shell: bash
    id: build
    run: make build 2>&1 | tee /tmp/build.log && grep "naming to docker.io" /tmp/build.log | awk  -F'[ /]' '{print "DOCKER_TAG=" $5 "/" $6 }' >> $GITHUB_OUTPUT

  - name: Log in to Docker Hub
    if: ${{ github.repository_owner == 'OpenSIPS' }}
    uses: docker/login-action@v4
    with:
      username: ${{ inputs.docker-username }}
      password: ${{ inputs.docker-token }}

  - name: Log in to GitHub Container Registry
    if: ${{ github.repository_owner == 'OpenSIPS' && inputs.ghcr-token != '' }}
    uses: docker/login-action@v4
    with:
      registry: ghcr.io
      username: ${{ github.repository_owner }}
      password: ${{ inputs.ghcr-token }}

  - name: Publish the Docker image to Docker Hub
    if: ${{ github.repository_owner == 'OpenSIPS' }}
    shell: bash
    run: docker push ${{ steps.build.outputs.DOCKER_TAG }}

  - name: Publish the Docker image to GitHub Container Registry
    if: ${{ github.repository_owner == 'OpenSIPS' && inputs.ghcr-token != '' }}
    id: ghcr
    shell: bash
    run: |
      GHCR_REPO="${{ inputs.ghcr-repo }}"
      PACKAGE_NAME="${PACKAGE_NAME:-opensips}"
      GHCR_PATH="opensips${GHCR_REPO:+/$GHCR_REPO}/${PACKAGE_NAME}"
      GHCR_TAG="ghcr.io/${GHCR_PATH}:${OPENSIPS_DOCKER_TAG:-latest}"
      docker tag "opensips/${PACKAGE_NAME}:${OPENSIPS_DOCKER_TAG:-latest}" "$GHCR_TAG"
      docker push "$GHCR_TAG"
      echo "GHCR_TAG=$GHCR_TAG" >> $GITHUB_OUTPUT

  - name: Summary
    if: ${{ always() }}
    shell: bash
    run: |
      IMAGE="${{ steps.build.outputs.DOCKER_TAG }}"
      VERSION=$(make -s print-OPENSIPS_VERSION)
      MINOR=$(make -s print-OPENSIPS_VERSION_MINOR)
      BUILD=$(make -s print-OPENSIPS_BUILD)
      COMPONENT=$(make -s print-OPENSIPS_COMPONENT)
      MODULES=$(make -s print-OPENSIPS_EXTRA_MODULES)

      {
        echo "## OpenSIPS Docker image"
        echo
        echo "| Setting | Value |"
        echo "| --- | --- |"
        echo "| OpenSIPS version | ${VERSION}${MINOR:+.$MINOR} |"
        echo "| Debian release | $(make -s print-DEBIAN_RELEASE) |"
        echo "| Apt component | ${COMPONENT:-${VERSION}-${BUILD}} |"
        echo "| OpenSIPS CLI | $(make -s print-OPENSIPS_CLI) |"
        echo "| Extra modules | ${MODULES:-none} |"
        echo "| Docker target | $(make -s print-DOCKER_TARGET) |"
      } >> $GITHUB_STEP_SUMMARY

      if [ -z "$IMAGE" ]; then
        echo -e "\n:x: The image failed to build." >> $GITHUB_STEP_SUMMARY
        exit 0
      fi

      {
        echo
        echo "### Installed packages"
        echo
        echo "| Package | Version |"
        echo "| --- | --- |"
        docker run --rm --entrypoint dpkg-query "$IMAGE" \
          -W -f '${db:Status-Abbrev}|${Package}|${Version}\n' 'opensips*' | \
          awk -F'|' '$1 ~ /^ii/ { print "| `" $2 "` | " $3 " |" }'
        echo
        echo "### Published"
        echo
        if [ "${{ github.repository_owner }}" != "OpenSIPS" ]; then
          echo "* Nothing published, the image is only built on the OpenSIPS organization"
        else
          echo "* Docker Hub: \`$IMAGE\`"
          test -n "${{ steps.ghcr.outputs.GHCR_TAG }}" && \
            echo "* GHCR: \`${{ steps.ghcr.outputs.GHCR_TAG }}\`" || \
            echo "* GHCR: not published"
        fi
      } >> $GITHUB_STEP_SUMMARY
